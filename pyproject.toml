[project]
name = "managent-finguard"
version = "0.1.0"
description = "ManAgent / FinGuard : plan de contrôle déterministe pour systèmes multi-agents financiers"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.9",
    "langgraph>=0.6",
    "langgraph-checkpoint-sqlite>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
llm = ["langchain>=1.0"]
langfuse = ["langfuse>=3.0"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "BLE"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
"scripts/**" = ["S105"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
packages = ["src"]

[[tool.mypy.overrides]]
module = ["langchain.*", "langfuse.*"]
ignore_missing_imports = true
